name: CI
on: [push, pull_request]

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    runs-on: macos-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@1.99.0
        with:
          components: clippy, rustfmt
      - uses: Swatinem/rust-cache@v2
      - run: brew install ffmpeg
      - run: cargo fmt --check
      - run: cargo clippy --workspace --all-targets -- -D warnings
      # CI=true makes insta fail on unreviewed snapshot changes instead of writing them.
      - run: cargo test --workspace
      - name: Seeded multilingual recovery soak
        env:
          RETOLD_S8_OUTPUT: ${{ runner.temp }}/retold-s8-soak
        run: cargo test -p retold-engine --test s8_soak -- --ignored --nocapture
      - name: Preserve soak evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: multilingual-recovery-soak
          path: |
            ${{ runner.temp }}/retold-s8-soak/soak.json
            ${{ runner.temp }}/retold-s8-soak/case-*/worker.log
          if-no-files-found: ignore
      - run: python3 scripts/check-architecture.py
      - run: cargo install cargo-deny --version 0.20.2 --locked
      - run: cargo install cargo-audit --version 0.22.2 --locked
      - run: cargo deny check
      - run: cargo audit

  coverage:
    runs-on: macos-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@1.99.0
        with:
          components: llvm-tools-preview
      - uses: Swatinem/rust-cache@v2
      - run: brew install ffmpeg
      - run: cargo install cargo-llvm-cov --locked
      # Report only for now; a threshold gate follows once a baseline is recorded.
      - run: cargo llvm-cov --workspace --summary-only

  desktop:
    name: Desktop build (${{ matrix.os }})
    strategy:
      fail-fast: false
      matrix:
        os: [macos-latest, ubuntu-22.04, windows-latest]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@1.99.0
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: experiments/retold-desktop
      - name: Linux libraries
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y pkg-config libxkbcommon-dev libxkbcommon-x11-dev libwayland-dev \
            libvulkan-dev libx11-dev libx11-xcb-dev libxcb1-dev libfontconfig-dev libfreetype-dev \
            libasound2-dev libssl-dev libzstd-dev clang cmake
      - name: Build
        run: cargo build --locked --manifest-path experiments/retold-desktop/Cargo.toml --bin retold-studio
