[package]
name = "retold-providers"
description = "Retold providers: Claude Code CLI, Codex CLI, OpenRouter; router with fallback."
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
publish.workspace = true

[dependencies]
retold-core.workspace = true
async-trait.workspace = true
image.workspace = true
symphonia.workspace = true
base64 = "0.22"
directories.workspace = true
indexmap.workspace = true
reqwest.workspace = true
schemars.workspace = true
secrecy.workspace = true
serde.workspace = true
serde_json.workspace = true
tempfile.workspace = true
thiserror.workspace = true
tokio.workspace = true
tokio-util.workspace = true
toml.workspace = true
which.workspace = true

[target.'cfg(unix)'.dependencies]
nix = { version = "0.30", default-features = false, features = ["signal"] }
rustix = { version = "1.1.5", features = ["process"] }

[target.'cfg(windows)'.dependencies]
sysinfo = { version = "0.37", default-features = false, features = ["system"] }

[target.'cfg(target_os = "macos")'.dependencies]
libproc = "0.14.11"
sysctl = "0.7.1"

[dev-dependencies]
proptest.workspace = true
tokio = { workspace = true, features = ["test-util"] }

[lints]
workspace = true
