[package]
name = "retold-cli"
description = "Retold command interface."
default-run = "retold"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
publish.workspace = true

[features]
native-acceptance = []

[dependencies]
retold-app.workspace = true
clap.workspace = true
clap_complete.workspace = true
clap_mangen.workspace = true
serde_json.workspace = true
signal-hook = "0.3"
unicode-segmentation = "1"
ratatui = { version = "0.30", default-features = false, features = ["crossterm"] }
image.workspace = true
tempfile.workspace = true

[[bin]]
name = "retold"
path = "src/main.rs"

[[bin]]
name = "retold-next"
path = "src/bin/retold-next.rs"

[dev-dependencies]
clean-code-lints.workspace = true
blake3.workspace = true
retold-providers.workspace = true
retold-engine.workspace = true
retold-guide = { workspace = true, features = ["test-fixtures"] }
indexmap.workspace = true
assert_cmd.workspace = true
vt100 = "0.18.1"

[target.'cfg(unix)'.dependencies]
rustix = { version = "1.1.5", features = ["termios"] }

[lints]
workspace = true
